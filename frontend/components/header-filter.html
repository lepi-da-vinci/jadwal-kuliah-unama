    <header class="header">
      <h1>Jadwal Kuliah</h1>
      <div class="header-actions">
        <button id="sync-btn" class="btn btn-primary" aria-label="Sinkron">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round">
            <polyline points="23 4 23 10 17 10" />
            <polyline points="1 20 1 14 7 14" />
            <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15" />
          </svg>
          Sinkron
        </button>
        <button id="test-wa-btn" class="btn btn-secondary" aria-label="Setting">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"></circle>
            <path
              d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z">
            </path>
          </svg>
          Setting
        </button>
        <div class="stats-row" id="stat-container">
          <div class="stat-badge">Memuat statistik...</div>
        </div>
        <button id="theme-toggle" class="btn btn-ghost" aria-label="Ganti tema gelap terang">
          <svg class="moon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
          </svg>
          <svg class="sun-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round" style="display:none">
            <circle cx="12" cy="12" r="5" />
            <line x1="12" y1="1" x2="12" y2="3" />
            <line x1="12" y1="21" x2="12" y2="23" />
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" />
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" />
            <line x1="1" y1="12" x2="3" y2="12" />
            <line x1="21" y1="12" x2="23" y2="12" />
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" />
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" />
          </svg>
        </button>
      </div>
    </header>

    <div class="card">
      <div class="filters">
        <div class="filter-group">
          <label for="filter-tanggal">Tanggal</label>
          <input type="date" id="filter-tanggal" autocomplete="off">
        </div>
        <div class="filter-group">
          <label>Waktu</label>
          <div class="custom-select-wrapper" id="wrapper-waktu">
            <div class="custom-select-trigger" tabindex="0" role="button" aria-haspopup="listbox"
              onclick="toggleCustomSelect('waktu', event)">
              <span class="custom-select-label" id="label-waktu">Semua Waktu</span>
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="6 9 12 15 18 9"></polyline>
              </svg>
            </div>
            <div class="aslab-list-container custom-select-dropdown" id="dropdown-waktu">
              <div class="aslab-list-item active" data-value="semua"
                onclick="selectCustomOption('waktu', 'semua', 'Semua Waktu')">Semua Waktu</div>
              <div class="aslab-list-item" data-value="sekarang"
                onclick="selectCustomOption('waktu', 'sekarang', 'Jadwal Saat Ini (Otomatis)')">Jadwal Saat Ini
                (Otomatis)</div>
            </div>
            <input type="hidden" id="filter-waktu" value="semua">
          </div>
        </div>
        <div class="filter-group">
          <label>Status Kuliah</label>
          <div class="custom-select-wrapper" id="wrapper-metode">
            <div class="custom-select-trigger" tabindex="0" role="button" aria-haspopup="listbox"
              onclick="toggleCustomSelect('metode', event)">
              <span class="custom-select-label" id="label-metode">Semua Status</span>
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="6 9 12 15 18 9"></polyline>
              </svg>
            </div>
            <div class="aslab-list-container custom-select-dropdown" id="dropdown-metode">
              <div class="aslab-list-item active" data-value="semua"
                onclick="selectCustomOption('metode', 'semua', 'Semua Status')">Semua Status</div>
              <div class="aslab-list-item" data-value="TM"
                onclick="selectCustomOption('metode', 'TM', 'Tatap Muka (TM)')">Tatap Muka (TM)</div>
              <div class="aslab-list-item" data-value="OL" onclick="selectCustomOption('metode', 'OL', 'Online (OL)')">
                Online (OL)</div>
              <div class="aslab-list-item" data-value="CC" onclick="selectCustomOption('metode', 'CC', 'Cancel (CC)')">
                Cancel (CC)</div>
            </div>
            <input type="hidden" id="filter-metode" value="semua">
          </div>
        </div>
        <div class="filter-group">
          <label>Lokasi Kampus</label>
          <div class="custom-select-wrapper" id="wrapper-kampus">
            <div class="custom-select-trigger" tabindex="0" role="button" aria-haspopup="listbox"
              onclick="toggleCustomSelect('kampus', event)">
              <span class="custom-select-label" id="label-kampus">Semua Kampus</span>
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="6 9 12 15 18 9"></polyline>
              </svg>
            </div>
            <div class="aslab-list-container custom-select-dropdown" id="dropdown-kampus">
              <div class="aslab-list-item active" data-value="semua"
                onclick="selectCustomOption('kampus', 'semua', 'Semua Kampus')">Semua Kampus</div>
              <div class="aslab-list-item" data-value="Kampus Kobar"
                onclick="selectCustomOption('kampus', 'Kampus Kobar', 'Kampus Kobar')">Kampus Kobar</div>
              <div class="aslab-list-item" data-value="Kampus Thehok"
                onclick="selectCustomOption('kampus', 'Kampus Thehok', 'Kampus Thehok')">Kampus Thehok</div>
            </div>
            <input type="hidden" id="filter-kampus" value="semua">
          </div>
        </div>
        <div class="filter-group">
          <label>Kategori Ruangan</label>
          <div class="custom-select-wrapper" id="wrapper-kategori-ruang">
            <div class="custom-select-trigger" tabindex="0" role="button" aria-haspopup="listbox"
              onclick="toggleCustomSelect('kategori-ruang', event)">
              <span class="custom-select-label" id="label-kategori-ruang">Semua Kategori</span>
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="6 9 12 15 18 9"></polyline>
              </svg>
            </div>
            <div class="aslab-list-container custom-select-dropdown" id="dropdown-kategori-ruang">
              <div class="aslab-list-item active" data-value="semua"
                onclick="selectCustomOption('kategori-ruang', 'semua', 'Semua Kategori')">Semua Kategori</div>
              <div class="aslab-list-item" data-value="labor"
                onclick="selectCustomOption('kategori-ruang', 'labor', 'Labor')">Labor</div>
              <div class="aslab-list-item" data-value="kelas"
                onclick="selectCustomOption('kategori-ruang', 'kelas', 'Kelas')">Kelas</div>
            </div>
            <input type="hidden" id="filter-kategori-ruang" value="semua">
          </div>
        </div>
        <div class="filter-group">
          <label>Ruangan / Labor</label>
          <div class="custom-select-wrapper" id="wrapper-ruangan">
            <div class="custom-select-trigger" tabindex="0" role="button" aria-haspopup="listbox"
              onclick="toggleCustomSelect('ruangan', event)">
              <span class="custom-select-label" id="label-ruangan">Semua Ruangan</span>
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="6 9 12 15 18 9"></polyline>
              </svg>
            </div>
            <div class="aslab-list-container custom-select-dropdown" id="dropdown-ruangan">
              <div class="aslab-list-item active" data-value="semua"
                onclick="selectCustomOption('ruangan', 'semua', 'Semua Ruangan')">Semua Ruangan</div>
            </div>
            <input type="hidden" id="filter-ruangan" value="semua">
          </div>
        </div>
        <div class="filter-group">
          <label style="visibility: hidden;">Info Lain</label>
          <button id="btn-fitur-tambahan"
            style="display: flex; align-items: center; justify-content: center; height: 100%; padding: 10px 14px; border: none; border-radius: var(--radius-md); background: var(--bg-card); color: var(--text); font-size: 0.9em; cursor: pointer; transition: all 0.2s; outline: none; box-shadow: var(--clay-inner);">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round" style="margin-right: 6px;">
              <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
            </svg>
            Info Lain
          </button>
        </div>
      </div>
