  <!-- ==================== MODAL SECURITY & OTORISASI ADMIN ==================== -->

  <!-- Modal Password Admin -->
  <div id="password-modal" class="modal-overlay" role="dialog" aria-modal="true" aria-label="Password Admin"
    style="z-index: 10000;">
    <div class="modal-box" style="max-width: 480px; width: 94%;">
      <div class="modal-icon" style="color: var(--primary);">
        <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
      </div>
      <h2>Otorisasi Admin</h2>
      <div class="modal-body" style="text-align: center;">
        <p id="password-message" style="margin-bottom: 15px;">Masukkan password Admin untuk melanjutkan:</p>
        <input type="password" id="admin-password-input"
          style="width: 100%; padding: 12px; text-align: center; font-size: 1.2em; letter-spacing: 2px; border-radius: var(--radius-sm); border: 1.5px solid var(--border); background: var(--bg-card); color: var(--text); outline: none;"
          placeholder="••••••••">
      </div>
      <div style="display: flex; gap: 10px; justify-content: center; margin-top: 20px;">
        <button class="modal-btn" style="background: var(--text-muted);" id="password-cancel-btn">Batal</button>
        <button class="modal-btn" id="password-submit-btn">Lanjut</button>
      </div>
    </div>
  </div>

  <!-- Modal Konfirmasi Bahaya -->
  <div id="danger-modal" class="modal-overlay" role="dialog" aria-modal="true" aria-label="Peringatan Bahaya"
    style="z-index: 10000;">
    <div class="modal-box" style="max-width: 540px; width: 94%; border-top: 5px solid var(--badge-cc);">
      <div class="modal-icon" style="background: rgba(239, 68, 68, 0.15); color: var(--badge-cc);">
        <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
          <line x1="12" y1="9" x2="12" y2="13"></line>
          <line x1="12" y1="17" x2="12.01" y2="17"></line>
        </svg>
      </div>
      <h2 style="color: var(--badge-cc);">Peringatan Berbahaya!</h2>
      <div class="modal-body" style="text-align: center;">
        <p id="danger-message" style="margin-bottom: 5px; font-weight: 500;"></p>
        <p style="font-size: 0.9em; color: var(--text-muted); margin-bottom: 15px;">Tindakan ini sangat berisiko dan tidak bisa dikembalikan. Pastikan Anda benar-benar sadar akan dampaknya.</p>
      </div>
      <div style="display: flex; gap: 10px; justify-content: center; margin-top: 20px;">
        <button class="modal-btn" style="background: var(--text-muted);" id="danger-cancel-btn">Batal</button>
        <button class="modal-btn" style="background: var(--badge-cc);" id="danger-submit-btn">Ya, Hapus Semua!</button>
      </div>
    </div>
  </div>

  <!-- Modal Konfirmasi Teks Final -->
  <div id="final-danger-modal" class="modal-overlay" role="dialog" aria-modal="true" aria-label="Konfirmasi Akhir"
    style="z-index: 10001;">
    <div class="modal-box" style="max-width: 540px; width: 94%; border-top: 5px solid var(--badge-cc);">
      <div class="modal-icon" style="background: rgba(239, 68, 68, 0.15); color: var(--badge-cc);">
        <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <polygon points="7.86 2 16.14 2 22 7.86 22 16.14 16.14 22 7.86 22 2 16.14 2 7.86 7.86 2"></polygon>
          <line x1="12" y1="8" x2="12" y2="12"></line>
          <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
      </div>
      <h2 style="color: var(--badge-cc);">Konfirmasi Akhir</h2>
      <div class="modal-body" style="text-align: center;">
        <p style="margin-bottom: 10px;">Ketik ulang kode unik berikut untuk melanjutkan:</p>
        <p id="final-danger-code"
          style="font-weight: bold; letter-spacing: 2px; font-size: 1.2em; color: var(--primary); background: var(--bg-elevated); padding: 10px; border-radius: var(--radius-sm); user-select: none;">CODE</p>
        <input type="text" id="final-danger-input" autocomplete="off"
          style="width: 100%; padding: 12px; margin-top: 15px; text-align: center; font-size: 1.1em; letter-spacing: 1px; border-radius: var(--radius-sm); border: 1.5px solid var(--border); background: var(--bg-card); color: var(--text); outline: none;"
          placeholder="Ketik kode di sini">
      </div>
      <div style="display: flex; gap: 10px; justify-content: center; margin-top: 20px;">
        <button class="modal-btn" style="background: var(--text-muted);" id="final-danger-cancel-btn">Batal</button>
        <button class="modal-btn" style="background: var(--badge-cc); opacity: 0.5; cursor: not-allowed;"
          id="final-danger-submit-btn" disabled>Hapus Permanen</button>
      </div>
    </div>
  </div>
