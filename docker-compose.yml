services:
  db:
    image: mysql:8.0
    container_name: jadwal_db
    restart: always
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: "db_jadwal_kuliah"
    volumes:
      - db_data:/var/lib/mysql
      # Auto-import schema when database is created for the first time
      - ./backend/database.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "127.0.0.1:3307:3306"

  wa-bot:
    build: 
      context: ./wa-bot
      dockerfile: Dockerfile
    container_name: jadwal_wa_bot
    restart: always
    environment:
      - WA_BOT_SECRET_KEY=${WA_BOT_SECRET_KEY:-unama_wa_secret_7f8e9d0a1b2c3d4e5f6a8b9c0d1e2f3a}
      - BACKEND_WEBHOOK_URL=http://backend:8000/api/webhook/wa
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      # Persist WhatsApp login sessions
      - ./wa-bot/baileys_auth_info:/app/baileys_auth_info
      - ./wa-bot/server.js:/app/server.js

  backend:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: jadwal_backend
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - ./:/app
    environment:
      - DB_HOST=db
      - DB_USER=root
      - DB_PASSWORD=
      - DB_NAME=db_jadwal_kuliah
      - WA_BOT_URL=http://wa-bot:3000/send
      - WA_BOT_SECRET_KEY=${WA_BOT_SECRET_KEY:-unama_wa_secret_7f8e9d0a1b2c3d4e5f6a8b9c0d1e2f3a}
    depends_on:
      - db
      - wa-bot

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: jadwal_tunnel
    restart: always
    command: tunnel --url http://backend:8000 --logfile /var/log/cloudflared/tunnel.log
    volumes:
      - ./tunnel_logs:/var/log/cloudflared
    # Jika nanti punya Custom Domain sendiri, ganti baris command di atas dengan:
    # command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - backend

volumes:
  db_data:
